<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="canonical" href="https://www.lawofattractioncentral.net{{ page.url | replace:'index.html','' | replace:'.html','' }}" />

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="mzKSZ65ZwaI1YvLfQKjdr1yiwCFYax6hHhQFbp3aPfc" />

  <!--
    FONTS: Cormorant Garamond loads BLOCKING and synchronously — it is used
    by the H1 (brand-main-title) which is the LCP element on every page.
    Loading it synchronously guarantees the font is present at first paint,
    which is why Lighthouse scores 100. Lato loads non-blocking (body text only).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap"
        rel="stylesheet">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap"
          rel="stylesheet">
  </noscript>

  <style>
    /* ─────────────────────────────────────────
       GLOBAL BASE
    ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      background: #f9f6f0;
      color: #555;
      line-height: 1.85;
    }
    h1, h2, h3, h4, h5, h6 { color: #1a1a1a; }
    a { color: inherit; text-decoration: none; }

    /* SKIP TO MAIN */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: static;
      width: auto;
      height: auto;
      background: #d4af7a;
      color: #000;
      padding: 8px 16px;
      display: block;
      text-align: center;
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    /* MAIN LANDMARK */
    main { display: block; width: 100%; }

    /* GLOBAL BLOCKQUOTE */
    blockquote {
      background: #ffffff;
      border-left: 6px solid #d4af7a;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      border-radius: 4px;
      padding: 2rem 2rem 1.5rem 2.5rem;
      margin: 2rem 0;
      position: relative;
    }
    blockquote::before {
      content: '\201C';
      color: #d4af7a;
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      line-height: 1;
      position: absolute;
      top: -0.15rem;
      left: 0.75rem;
      pointer-events: none;
    }
    blockquote p {
      color: #222;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      line-height: 1.75;
      margin: 0 0 0.75rem;
    }
    blockquote cite,
    blockquote footer {
      display: block;
      color: #7a5f3a;
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* RESPONSIVE IMAGE */
    .responsive-image {
      display: block;
      margin: 40px auto;
      max-width: 100%;
      height: auto;
    }

    /* ─────────────────────────────────────────
       DESIGN SYSTEM TOKENS
    ───────────────────────────────────────── */
    :root {
      --bg-header:    #000000;
      --gold-light:   #fdf6e2;
      --gold-mid:     #d4af7a;
      --gold-dark:    #8a6421;
      --silver-light: #ffffff;
      --silver-mid:   #a0a0a0;
      --silver-dark:  #4a4a4a;
    }

    /* ─────────────────────────────────────────
       MASTER HEADER
    ───────────────────────────────────────── */
    .master-header {
      position: relative;
      background: var(--bg-header);
      width: 100%;
      padding: 52px 24px 44px;
      text-align: center;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .header-ambient-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 750px;
      height: 280px;
      background: radial-gradient(circle,
        rgba(212,175,122,0.12) 0%,
        rgba(184,137,42,0.03) 60%,
        transparent 100%);
      pointer-events: none;
      z-index: 1;
    }
    .header-content-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      z-index: 2;
    }

    /* ── Title (H1 — LCP element) ── */
    .brand-main-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px, 5vw, 52px);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.2;
      margin: 0 auto 16px;
      padding: 0;
      background: linear-gradient(180deg,
        #ffffff 0%, #e8cb97 45%, #b38946 55%, #fbf3d5 90%, #8a6421 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.85));
    }

    /* ── Central divider row ── */
    .central-row-wrapper {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
      max-width: 680px;
      margin: 0 auto 24px;
    }
    .accent-line-left-container,
    .accent-line-right-container {
      display: flex;
      align-items: center;
      position: relative;
      height: 20px;
      width: 100%;
    }
    .accent-line-left-container  { justify-content: flex-end; }
    .accent-line-right-container { justify-content: flex-start; }
    .accent-line-left {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, var(--gold-dark) 60%, var(--gold-light) 100%);
    }
    .accent-line-right {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg,
        var(--gold-light) 0%, var(--gold-dark) 40%, transparent 100%);
    }
    .star-flare {
      color: var(--gold-light);
      font-size: 20px;
      line-height: 1;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      text-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 4px var(--gold-mid);
    }
    .star-flare.left-side  { right: -2px; }
    .star-flare.right-side { left: -2px; }

    /* ── Compass Icon ── */
    .brand-secondary-icon-container {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 0 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a140e 0%, #0a0806 65%, #000000 100%);
      box-shadow:
        0 0 0 1px var(--gold-dark),
        inset 0 0 8px rgba(0,0,0,0.95),
        0 4px 10px rgba(0,0,0,0.75),
        0 0 14px rgba(212,175,122,0.55),
        0 0 28px rgba(212,175,122,0.25),
        0 0 48px rgba(184,137,42,0.12);
      flex-shrink: 0;
    }
    .avatar-bevel-rim {
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 2px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      background: linear-gradient(135deg,
        var(--gold-light) 0%, var(--gold-dark) 50%, var(--gold-light) 100%) border-box;
      -webkit-mask:
        linear-gradient(#fff 0 0) padding-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      filter: drop-shadow(0 0 3px rgba(253,246,226,0.6));
    }
    .avatar-tracker-ring {
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border-radius: 50%;
      border: 1px double rgba(212,175,122,0.4);
    }
    .avatar-center-vortex {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle,
        #ffffff 0%, #fff0d0 25%, var(--gold-mid) 55%, var(--gold-dark) 100%);
      z-index: 20;
      box-shadow:
        0 0 10px var(--gold-mid),
        0 0 4px #ffffff,
        0 0 18px rgba(212,175,122,0.5);
    }
    .compass-needle-group {
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      z-index: 10;
    }
    .needle-point {
      position: absolute;
      transform-origin: bottom center;
    }
    .needle-point.primary {
      width: 0; height: 0;
      bottom: 50%; left: 50%;
    }
    .needle-point.primary::before {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 2.5px; height: 21px;
      background: linear-gradient(90deg, #ffffff 0%, var(--gold-light) 100%);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .needle-point.primary::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 2.5px; height: 21px;
      background: linear-gradient(90deg, var(--gold-dark) 0%, #442f0b 100%);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }
    .needle-point.secondary {
      width: 0; height: 0;
      bottom: 50%; left: 50%;
    }
    .needle-point.secondary::before {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 2px; height: 15px;
      background: linear-gradient(90deg, #ffffff 0%, var(--silver-light) 100%);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .needle-point.secondary::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 2px; height: 15px;
      background: linear-gradient(90deg, var(--silver-mid) 0%, var(--silver-dark) 100%);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }
    .pt-n  { transform: translateX(-50%) rotate(0deg); }
    .pt-ne { transform: translateX(-50%) rotate(45deg); }
    .pt-e  { transform: translateX(-50%) rotate(90deg); }
    .pt-se { transform: translateX(-50%) rotate(135deg); }
    .pt-s  { transform: translateX(-50%) rotate(180deg); }
    .pt-sw { transform: translateX(-50%) rotate(225deg); }
    .pt-w  { transform: translateX(-50%) rotate(270deg); }
    .pt-nw { transform: translateX(-50%) rotate(315deg); }

    /* ── Tagline ── */
    .subtitle-row-box {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .border-divider-line {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .border-divider-line .line-strut {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(179,137,70,0.3) 20%,
        rgba(253,246,226,0.45) 50%,
        rgba(179,137,70,0.3) 80%,
        transparent 100%);
    }
    .border-divider-line .diamond-node {
      color: var(--gold-dark);
      font-size: 9px;
      opacity: 0.7;
    }
    .border-divider-line .diamond-node.left  { margin-right: 12px; }
    .border-divider-line .diamond-node.right { margin-left: 12px; }
    .tagline-text-element {
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      font-size: clamp(10px, 1.3vw, 13px);
      font-weight: 400;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e5c48f;
      margin: 11px 0;
      padding: 0;
      text-align: center;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(12px, 3vw, 32px);
      filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.6));
    }

    /* ─────────────────────────────────────────
       MOBILE HEADER BREAKPOINTS
    ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .master-header { padding: 32px 16px 28px; }
      .brand-secondary-icon-container { width: 46px; height: 46px; margin: 0 18px; }
      .brand-secondary-icon-container .avatar-center-vortex { width: 9px; height: 9px; }
      .brand-secondary-icon-container .needle-point.primary::before,
      .brand-secondary-icon-container .needle-point.primary::after { width: 2px; height: 16px; }
      .brand-secondary-icon-container .needle-point.secondary::before,
      .brand-secondary-icon-container .needle-point.secondary::after { width: 1.5px; height: 12px; }
      .central-row-wrapper { max-width: 100%; }
      .tagline-text-element { flex-direction: column; gap: 4px; letter-spacing: 0.18em; }
    }

    /* ─────────────────────────────────────────
       CHECKBOX HACK — mobile nav toggle
    ───────────────────────────────────────── */
    #nav-toggle { display: none; }
    .nav-toggle-label {
      display: none;
      cursor: pointer;
      padding: 12px 15px;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1001;
    }
    .nav-toggle-label span,
    .nav-toggle-label span::before,
    .nav-toggle-label span::after {
      display: block;
      background: #d4af7a;
      height: 2px;
      width: 22px;
      border-radius: 1px;
      position: relative;
      transition: all 0.3s ease;
    }
    .nav-toggle-label span::before,
    .nav-toggle-label span::after { content: ''; position: absolute; }
    .nav-toggle-label span::before { top: -7px; }
    .nav-toggle-label span::after  { top: 7px; }
    #nav-toggle:checked ~ nav .nav-toggle-label span { background: transparent; }
    #nav-toggle:checked ~ nav .nav-toggle-label span::before { transform: rotate(45deg); top: 0; }
    #nav-toggle:checked ~ nav .nav-toggle-label span::after  { transform: rotate(-45deg); top: 0; }

    /* ─────────────────────────────────────────
       STICKY NAV
    ───────────────────────────────────────── */
    nav {
      background: #0f0f0f;
      border-bottom: 1px solid #d4af7a;
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }
    .nav-inner { display: none; }
    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0;
      padding: 0;
      margin: 0;
    }
    nav ul li a,
    nav ul li a:visited {
      display: block;
      color: #d4af7a;
      text-decoration: none;
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
      padding: 14px 14px;
      transition: color 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }
    nav ul li a:hover,
    nav ul li a[aria-current="page"] {
      color: #fff;
      background: rgba(212,175,122,0.08);
    }

    /* ─────────────────────────────────────────
       MOBILE NAV
    ───────────────────────────────────────── */
    @media (max-width: 768px) {
      .nav-toggle-label { display: block; }
      .nav-inner {
        display: flex;
        position: relative;
        padding: 14px 15px;
        align-items: center;
        justify-content: center;
        min-height: 50px;
      }
      .nav-brand {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 400;
        color: #d4af7a;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      nav ul {
        display: none;
        flex-direction: column;
        width: 100%;
        border-top: 1px solid rgba(212,175,122,0.2);
      }
      #nav-toggle:checked ~ nav ul { display: flex; }
      nav ul li {
        width: 100%;
        text-align: center;
        border-bottom: 1px solid rgba(212,175,122,0.1);
      }
      nav ul li:last-child { border-bottom: none; }
      nav ul li a,
      nav ul li a:visited { padding: 14px 20px; font-size: 0.8rem; }
    }
  </style>

  <!-- PERF: Lazy-loaded GA4 — fires 2s after page is fully interactive -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Q423RGSLCC';
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Q423RGSLCC');
      }, 2000);
    });
  </script>

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
