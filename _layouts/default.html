<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="canonical" href="https://www.lawofattractioncentral.net{{ page.url | replace:'index.html','' | replace:'.html','' }}" />

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="mzKSZ65ZwaI1YvLfQKjdr1yiwCFYax6hHhQFbp3aPfc" />

  <!--
    PERF: Preload self-hosted Cormorant Garamond — tells the browser to fetch
    the font files immediately during HTML parse, in parallel with everything
    else. Without these hints the browser only discovers the fonts after
    parsing the @font-face rules in the <style> block below, causing the
    ~1,800ms render delay that was inflating LCP on every page.
    The 400 regular and 400 italic weights are preloaded because p.lead
    (the typical LCP element) is italic, and h1/h2 use 400 regular.
    The 600 weight is not preloaded — it appears below the fold.
  -->
  <link rel="preload" href="/assets/fonts/cormorant-garamond-400.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cormorant-garamond-400-italic.woff2"
        as="font" type="font/woff2" crossorigin>

  <!--
    PERF: Self-hosted Cormorant Garamond — eliminates external DNS + stylesheet
    round trip. Files load from same origin as HTML with no extra connection.
  -->
  <style>
    /* CORMORANT GARAMOND — self-hosted, font-display: swap */
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/assets/fonts/cormorant-garamond-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/assets/fonts/cormorant-garamond-600.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url('/assets/fonts/cormorant-garamond-400-italic.woff2') format('woff2');
    }

    /* GLOBAL BASE */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', sans-serif;
      background: #f9f6f0;
      color: #555;
      line-height: 1.85;
    }
    /* HEADING PROTECTION — keep section headers crisp and dark */
    h1, h2, h3, h4, h5, h6 {
      color: #1a1a1a;
    }
    /*
      FIX: Neutral link reset so browser UA blue/white defaults
      never bleed through. Each component (nav, content) sets
      its own colour explicitly on top of this.
    */
    a {
      color: inherit;
      text-decoration: none;
    }
    /* SKIP TO MAIN — accessibility */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: static;
      width: auto;
      height: auto;
      background: #d4af7a;
      color: #000;
      padding: 8px 16px;
      display: block;
      text-align: center;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    /* MAIN LANDMARK */
    main {
      display: block;
      width: 100%;
    }
    /* GLOBAL BLOCKQUOTE — quote card styles */
    blockquote {
      background: #ffffff;
      border-left: 6px solid #d4af7a;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      border-radius: 4px;
      padding: 2rem 2rem 1.5rem 2.5rem;
      margin: 2rem 0;
      position: relative;
    }
    blockquote::before {
      content: '\201C';
      color: #d4af7a;
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      line-height: 1;
      position: absolute;
      top: -0.15rem;
      left: 0.75rem;
      pointer-events: none;
    }
    blockquote p {
      color: #222;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      line-height: 1.75;
      margin: 0 0 0.75rem;
    }
    blockquote cite,
    blockquote footer {
      display: block;
      color: #7a5f3a;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* RESPONSIVE IMAGE — universal utility class */
    .responsive-image {
      display: block;
      margin: 40px auto;
      max-width: 100%;
      height: auto;
    }
  </style>

  <!--
    PERF: Lato loads NON-BLOCKING — used for body text only, never the LCP
    element. Deferring it is safe; the browser falls back to sans-serif
    briefly then swaps in Lato with no layout shift (display=swap).
  -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet">
  </noscript>

  <!-- PERF: Lazy-loaded GA4 — fires 2s after page is fully interactive -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Q423RGSLCC';
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Q423RGSLCC');
      }, 2000);
    });
  </script>

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
