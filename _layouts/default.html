<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="canonical" href="https://www.lawofattractioncentral.net{{ page.url | replace:'index.html','' | replace:'.html','' }}" />
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="mzKSZ65ZwaI1YvLfQKjdr1yiwCFYax6hHhQFbp3aPfc" />
  <!-- FONTS: preconnect + non-blocking load with font-display swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  </noscript>
  <style>
    /* GLOBAL BASE */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', sans-serif;
      background: #f9f6f0;
      color: #555;
      line-height: 1.85;
    }
    /* HEADING PROTECTION — keep section headers crisp and dark */
    h1, h2, h3, h4, h5, h6 {
      color: #1a1a1a;
    }
    /*
      FIX: Neutral link reset so browser UA blue/white defaults
      never bleed through. Each component (nav, content) sets
      its own colour explicitly on top of this.
    */
    a {
      color: inherit;
      text-decoration: none;
    }
    /* SKIP TO MAIN — accessibility */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: static;
      width: auto;
      height: auto;
      background: #d4af7a;
      color: #000;
      padding: 8px 16px;
      display: block;
      text-align: center;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    /* MAIN LANDMARK */
    main {
      display: block;
      width: 100%;
    }
    /* GLOBAL BLOCKQUOTE — quote card styles */
    blockquote {
      background: #ffffff;
      border-left: 6px solid #d4af7a;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      border-radius: 4px;
      padding: 2rem 2rem 1.5rem 2.5rem;
      margin: 2rem 0;
      position: relative;
    }
    blockquote::before {
      content: '\201C';
      color: #d4af7a;
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      line-height: 1;
      position: absolute;
      top: -0.15rem;
      left: 0.75rem;
      pointer-events: none;
    }
    blockquote p {
      color: #222;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      line-height: 1.75;
      margin: 0 0 0.75rem;
    }
    blockquote cite,
    blockquote footer {
      display: block;
      color: #7a5f3a;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* RESPONSIVE IMAGE — universal utility class */
    .responsive-image {
      display: block;
      margin: 40px auto;
      max-width: 100%;
      height: auto;
    }

    /* ─────────────────────────────────────────
       PAGE INTRO / LEAD — LCP FIX
       Moved here from per-page embedded style blocks so this
       styling is available immediately (parsed as part of the
       small, fast global stylesheet) instead of waiting on each
       page's larger, page-specific <style> block further down
       the DOM. This is what was causing the LCP render-delay
       regression on .lead across every page after the header
       was resized. Safe to leave the same rules duplicated in
       individual page <style> blocks too — cascade just re-applies
       identical values, no visual change, no conflict.
    ───────────────────────────────────────── */
    .page-intro {
      max-width: 760px;
      margin: 50px auto 40px;
      padding: 0 20px;
      text-align: center;
    }
    .page-intro h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    .page-intro h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: #5c4520;
      margin: 0 0 18px;
    }
    .page-intro p.lead {
      font-size: 1.08rem;
      color: #444;
      font-style: italic;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script defer data-domain="lawofattractioncentral.net" src="https://statfa.st/tracker.js"></script>
</body>
</html>
