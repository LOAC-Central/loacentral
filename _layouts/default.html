<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  {% if page.permalink %}
  <link rel="canonical" href="https://www.lawofattractioncentral.net{{ page.permalink }}" />
  {% endif %}

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="mzKSZ65ZwaI1YvLfQKjdr1yiwCFYax6hHhQFbp3aPfc" />

  <!-- FONTS: preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    PERF FIX: Preload the Cormorant Garamond woff2 (regular 400) so the
    browser fetches it at highest priority before layout — eliminates the
    83% render-delay that was causing LCP to sit at 3,740ms.
    This preload covers the weight used by h1/h2/h3 and blockquotes globally.
  -->
  <link rel="preload" as="font" type="font/woff2"
        href="https://fonts.gstatic.com/s/cormorantgaramond/v22/co3YmX5slCNuHLi8bLeY9MK7whWMhyjQEl5fqg.woff2"
        crossorigin>

  <!-- Non-blocking Google Fonts load -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  </noscript>

  <style>
    /* GLOBAL BASE */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', sans-serif;
      background: #f9f6f0;
      color: #555;
      line-height: 1.85;
    }
    /* HEADING PROTECTION — keep section headers crisp and dark */
    h1, h2, h3, h4, h5, h6 {
      color: #1a1a1a;
    }
    /*
      FIX: Neutral link reset so browser UA blue/white defaults
      never bleed through. Each component (nav, content) sets
      its own colour explicitly on top of this.
    */
    a {
      color: inherit;
      text-decoration: none;
    }
    /* SKIP TO MAIN — accessibility */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .skip-link:focus {
      position: static;
      width: auto;
      height: auto;
      background: #d4af7a;
      color: #000;
      padding: 8px 16px;
      display: block;
      text-align: center;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    /* MAIN LANDMARK */
    main {
      display: block;
      width: 100%;
    }
    /* GLOBAL BLOCKQUOTE — quote card styles */
    blockquote {
      background: #ffffff;
      border-left: 6px solid #d4af7a;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
      border-radius: 4px;
      padding: 2rem 2rem 1.5rem 2.5rem;
      margin: 2rem 0;
      position: relative;
    }
    blockquote::before {
      content: '\201C';
      color: #d4af7a;
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      line-height: 1;
      position: absolute;
      top: -0.15rem;
      left: 0.75rem;
      pointer-events: none;
    }
    blockquote p {
      color: #222;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      line-height: 1.75;
      margin: 0 0 0.75rem;
    }
    blockquote cite,
    blockquote footer {
      display: block;
      color: #7a5f3a;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* RESPONSIVE IMAGE — universal utility class */
    .responsive-image {
      display: block;
      margin: 40px auto;
      max-width: 100%;
      height: auto;
    }
  </style>

  <!--
    PERF FIX: Changed from async to defer.
    async executes immediately on load and can still block rendering.
    defer waits until after the page has fully parsed and painted,
    so it no longer contributes to FCP or LCP delay.
  -->
  <script defer src="https://www.googletagmanager.com/gtag/js?id=G-Q423RGSLCC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Q423RGSLCC');
  </script>

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
