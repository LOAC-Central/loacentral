<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />

  {% if page.permalink %}
  <link rel="canonical" href="https://www.lawofattractioncentral.net{{ page.permalink }}" />
  {% endif %}

  <style>
    /* GLOBAL BASE — applies to every page */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', sans-serif;
      background: #f9f6f0;
      color: #1a1a1a;
      line-height: 1.85;
    }
  </style>
</head>
<body>

  {% include header.html %}

  {{ content }}

  {% include footer.html %}

</body>
</html>
