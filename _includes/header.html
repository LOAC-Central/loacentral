<!-- ══════════════════════════════════════════
     HEADER — all styles live in default.html <head>
══════════════════════════════════════════ -->
<header class="master-header" role="banner">

  <div class="header-ambient-glow" aria-hidden="true"></div>

  <div class="header-content-container">

    <h1 class="brand-main-title">Law of Attraction Central</h1>

    <div class="central-row-wrapper" aria-hidden="true">
      <div class="accent-line-left-container">
        <div class="accent-line-left"></div>
        <span class="star-flare left-side">✦</span>
      </div>

      <div class="brand-secondary-icon-container">
        <div class="avatar-bevel-rim"></div>
        <div class="avatar-tracker-ring"></div>
        <div class="avatar-center-vortex"></div>
        <div class="compass-needle-group">
          <div class="needle-point primary pt-n"></div>
          <div class="needle-point primary pt-e"></div>
          <div class="needle-point primary pt-s"></div>
          <div class="needle-point primary pt-w"></div>
          <div class="needle-point secondary pt-ne"></div>
          <div class="needle-point secondary pt-se"></div>
          <div class="needle-point secondary pt-sw"></div>
          <div class="needle-point secondary pt-nw"></div>
        </div>
      </div>

      <div class="accent-line-right-container">
        <span class="star-flare right-side">✦</span>
        <div class="accent-line-right"></div>
      </div>
    </div>

    <div class="subtitle-row-box" aria-hidden="true">
      <div class="border-divider-line">
        <span class="diamond-node left">✦</span>
        <div class="line-strut"></div>
        <span class="diamond-node right">✦</span>
      </div>
      <p class="tagline-text-element">
        <span>Structured Thinking.</span>
        <span>Empowered Living.</span>
        <span>Conscious Creation.</span>
      </p>
      <div class="border-divider-line">
        <span class="diamond-node left">✦</span>
        <div class="line-strut"></div>
        <span class="diamond-node right">✦</span>
      </div>
    </div>

  </div>
</header>

<nav aria-label="Main navigation">

  <div class="nav-inner">
    <span class="nav-brand">Law of Attraction Central</span>
    <label class="nav-toggle-label" for="nav-toggle" aria-label="Open menu">
      <span></span>
    </label>
  </div>

  <ul>
    <li><a href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
    <li><a href="{{ site.baseurl }}/law-of-attraction-quotes/"{% if page.url contains 'quotes' %} aria-current="page"{% endif %}>Quotes</a></li>
    <li><a href="{{ site.baseurl }}/law-of-attraction-love-relationships/"{% if page.url contains 'love' %} aria-current="page"{% endif %}>Love &amp; Relationships</a></li>
    <li><a href="{{ site.baseurl }}/law-attraction-money-abundance-101/"{% if page.url contains 'money' %} aria-current="page"{% endif %}>Money &amp; Finance</a></li>
    <li><a href="{{ site.baseurl }}/how-to-use-the-law-of-attraction/"{% if page.url contains 'how-to-use-the-law-of-attraction' %} aria-current="page"{% endif %}>How To Guide</a></li>
    <li><a href="{{ site.baseurl }}/about/"{% if page.url contains 'about' %} aria-current="page"{% endif %}>About</a></li>
  </ul>

</nav>
