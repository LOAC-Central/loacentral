<style>
  /* ─────────────────────────────────────────
     DESIGN SYSTEM TOKENS
  ───────────────────────────────────────── */
  :root {
    --bg-header:    #000000;
    --gold-light:   #fdf6e2;
    --gold-mid:     #d4af7a;
    --gold-dark:    #8a6421;
    --silver-light: #ffffff;
    --silver-mid:   #a0a0a0;
    --silver-dark:  #4a4a4a;
  }

  /* ─────────────────────────────────────────
     MASTER HEADER
  ───────────────────────────────────────── */
  .master-header {
    position: relative;
    background: var(--bg-header);
    width: 100%;
    padding: 22px 24px 18px;
    text-align: center;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* Ambient glow — no reflow, pointer-events off */
  .header-ambient-glow {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 480px;
    height: 140px;
    background: radial-gradient(circle,
      rgba(212,175,122,0.12) 0%,
      rgba(184,137,42,0.03) 60%,
      transparent 100%);
    pointer-events: none;
    z-index: 1;
  }

  .header-content-container {
    position: relative;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    z-index: 2;
  }

  /* ── Title ── */
  .brand-main-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.2;
    margin: 0 auto 8px;
    padding: 0;
    background: linear-gradient(180deg,
      #ffffff 0%, #e8cb97 45%, #b38946 55%, #fbf3d5 90%, #8a6421 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.85));
  }

  /* ── Central divider row ── */
  .central-row-wrapper {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
    max-width: 380px;
    margin: 0 auto 10px;
  }

  .accent-line-left-container,
  .accent-line-right-container {
    display: flex;
    align-items: center;
    position: relative;
    height: 20px;
    width: 100%;
  }
  .accent-line-left-container  { justify-content: flex-end; }
  .accent-line-right-container { justify-content: flex-start; }

  .accent-line-left {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%, var(--gold-dark) 60%, var(--gold-light) 100%);
  }
  .accent-line-right {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg,
      var(--gold-light) 0%, var(--gold-dark) 40%, transparent 100%);
  }

  .star-flare {
    color: var(--gold-light);
    font-size: 12px;
    line-height: 1;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    text-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 4px var(--gold-mid);
  }
  .star-flare.left-side  { right: -2px; }
  .star-flare.right-side { left: -2px; }

  /* ── Compass Icon ── */
  .brand-secondary-icon-container {
    position: relative;
    width: 32px;
    height: 32px;
    margin: 0 14px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a140e 0%, #0a0806 65%, #000000 100%);
    box-shadow:
      0 0 0 1px var(--gold-dark),
      inset 0 0 8px rgba(0,0,0,0.95),
      0 4px 10px rgba(0,0,0,0.75),
      0 0 14px rgba(212,175,122,0.55),
      0 0 28px rgba(212,175,122,0.25),
      0 0 48px rgba(184,137,42,0.12);
    flex-shrink: 0;
  }

  .avatar-bevel-rim {
    position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    background: linear-gradient(135deg,
      var(--gold-light) 0%, var(--gold-dark) 50%, var(--gold-light) 100%) border-box;
    -webkit-mask:
      linear-gradient(#fff 0 0) padding-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    opacity: 1;
    filter: drop-shadow(0 0 3px rgba(253,246,226,0.6));
  }

  .avatar-tracker-ring {
    position: absolute;
    top: 5px; left: 5px; right: 5px; bottom: 5px;
    border-radius: 50%;
    border: 1px double rgba(212,175,122,0.4);
  }

  .avatar-center-vortex {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle,
      #ffffff 0%, #fff0d0 25%, var(--gold-mid) 55%, var(--gold-dark) 100%);
    z-index: 20;
    box-shadow:
      0 0 10px var(--gold-mid),
      0 0 4px #ffffff,
      0 0 18px rgba(212,175,122,0.5);
  }

  .compass-needle-group {
    position: absolute;
    width: 100%; height: 100%;
    top: 0; left: 0;
    z-index: 10;
  }

  .needle-point {
    position: absolute;
    transform-origin: bottom center;
  }

  /* Primary (N/E/S/W) — gold */
  .needle-point.primary {
    width: 0; height: 0;
    bottom: 50%; left: 50%;
  }
  .needle-point.primary::before {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 1.5px; height: 12px;
    background: linear-gradient(90deg, #ffffff 0%, var(--gold-light) 100%);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
  .needle-point.primary::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 1.5px; height: 12px;
    background: linear-gradient(90deg, var(--gold-dark) 0%, #442f0b 100%);
    clip-path: polygon(0 0, 100% 100%, 0 100%);
  }

  /* Secondary (NE/SE/SW/NW) — silver */
  .needle-point.secondary {
    width: 0; height: 0;
    bottom: 50%; left: 50%;
  }
  .needle-point.secondary::before {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 1.2px; height: 9px;
    background: linear-gradient(90deg, #ffffff 0%, var(--silver-light) 100%);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
  .needle-point.secondary::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 1.2px; height: 9px;
    background: linear-gradient(90deg, var(--silver-mid) 0%, var(--silver-dark) 100%);
    clip-path: polygon(0 0, 100% 100%, 0 100%);
  }

  .pt-n  { transform: translateX(-50%) rotate(0deg); }
  .pt-ne { transform: translateX(-50%) rotate(45deg); }
  .pt-e  { transform: translateX(-50%) rotate(90deg); }
  .pt-se { transform: translateX(-50%) rotate(135deg); }
  .pt-s  { transform: translateX(-50%) rotate(180deg); }
  .pt-sw { transform: translateX(-50%) rotate(225deg); }
  .pt-w  { transform: translateX(-50%) rotate(270deg); }
  .pt-nw { transform: translateX(-50%) rotate(315deg); }

  /* ── Tagline / subtitle ── */
  .subtitle-row-box {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  .border-divider-line {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .border-divider-line .line-strut {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(179,137,70,0.3) 20%,
      rgba(253,246,226,0.45) 50%,
      rgba(179,137,70,0.3) 80%,
      transparent 100%);
  }
  .border-divider-line .diamond-node {
    color: var(--gold-dark);
    font-size: 9px;
    opacity: 0.7;
  }
  .border-divider-line .diamond-node.left  { margin-right: 12px; }
  .border-divider-line .diamond-node.right { margin-left: 12px; }

  .tagline-text-element {
    font-family: 'Lato', sans-serif;
    font-size: clamp(8px, 1vw, 10px);
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #e5c48f;
    margin: 5px 0;
    padding: 0;
    text-align: center;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(8px, 2vw, 20px);
    filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.6));
  }

  /* ─────────────────────────────────────────
     MOBILE HEADER BREAKPOINTS
  ───────────────────────────────────────── */
  @media (max-width: 600px) {
    .master-header {
      padding: 16px 16px 14px;
    }
    .brand-secondary-icon-container {
      width: 26px;
      height: 26px;
      margin: 0 10px;
    }
    .brand-secondary-icon-container .avatar-center-vortex {
      width: 5px;
      height: 5px;
    }
    .brand-secondary-icon-container .needle-point.primary::before,
    .brand-secondary-icon-container .needle-point.primary::after {
      width: 1.2px;
      height: 9px;
    }
    .brand-secondary-icon-container .needle-point.secondary::before,
    .brand-secondary-icon-container .needle-point.secondary::after {
      width: 1px;
      height: 7px;
    }
    .central-row-wrapper {
      max-width: 100%;
    }
    .tagline-text-element {
      flex-direction: column;
      gap: 3px;
      letter-spacing: 0.15em;
    }
  }

  /* ─────────────────────────────────────────
     CHECKBOX HACK
  ───────────────────────────────────────── */
  #nav-toggle { display: none; }

  .nav-toggle-label {
    display: none;
    cursor: pointer;
    padding: 12px 15px;
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1001;
  }
  .nav-toggle-label span,
  .nav-toggle-label span::before,
  .nav-toggle-label span::after {
    display: block;
    background: #d4af7a;
    height: 2px;
    width: 22px;
    border-radius: 1px;
    position: relative;
    transition: all 0.3s ease;
  }
  .nav-toggle-label span::before,
  .nav-toggle-label span::after {
    content: '';
    position: absolute;
  }
  .nav-toggle-label span::before { top: -7px; }
  .nav-toggle-label span::after  { top: 7px; }

  #nav-toggle:checked ~ nav .nav-toggle-label span { background: transparent; }
  #nav-toggle:checked ~ nav .nav-toggle-label span::before {
    transform: rotate(45deg); top: 0;
  }
  #nav-toggle:checked ~ nav .nav-toggle-label span::after {
    transform: rotate(-45deg); top: 0;
  }

  /* ─────────────────────────────────────────
     STICKY NAV
  ───────────────────────────────────────── */
  nav {
    background: #0f0f0f;
    border-bottom: 1px solid #d4af7a;
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
  }

  .nav-inner {
    display: none;
  }

  nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    padding: 0;
    margin: 0;
  }

  /* FIX 1: explicit gold + visited state beats browser UA defaults */
  nav ul li a,
  nav ul li a:visited {
    display: block;
    color: #d4af7a;
    text-decoration: none;
    font-family: 'Lato', sans-serif;
    /* FIX 2: font-weight 400 matches the loaded Lato subset */
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
    padding: 14px 14px;
    transition: color 0.2s ease, background 0.2s ease;
    white-space: nowrap;
  }
  nav ul li a:hover,
  nav ul li a[aria-current="page"] {
    color: #fff;
    background: rgba(212,175,122,0.08);
  }

  /* ─────────────────────────────────────────
     MOBILE NAV
  ───────────────────────────────────────── */
  @media (max-width: 768px) {
    .nav-toggle-label { display: block; }

    .nav-inner {
      display: flex;
      position: relative;
      padding: 14px 15px;
      align-items: center;
      justify-content: center;
      min-height: 50px;
    }

    /* nav-brand rule removed — brand now lives only in master-header */

    nav ul {
      display: none;
      flex-direction: column;
      width: 100%;
      border-top: 1px solid rgba(212,175,122,0.2);
    }

    #nav-toggle:checked ~ nav ul { display: flex; }

    nav ul li {
      width: 100%;
      text-align: center;
      border-bottom: 1px solid rgba(212,175,122,0.1);
    }
    nav ul li:last-child { border-bottom: none; }

    nav ul li a,
    nav ul li a:visited {
      padding: 14px 20px;
      font-size: 0.8rem;
    }
  }
</style>

<!-- ══════════════════════════════════════════
     CSS HEADER (zero HTTP request — replaces header image)
══════════════════════════════════════════ -->
<header class="master-header" role="banner">

  <div class="header-ambient-glow" aria-hidden="true"></div>

  <div class="header-content-container">

    {% if page.url == '/' %}
      <h1 class="brand-main-title">Law of Attraction Central</h1>
    {% else %}
      <p class="brand-main-title" role="heading" aria-level="2">Law of Attraction Central</p>
    {% endif %}

    <div class="central-row-wrapper" aria-hidden="true">
      <div class="accent-line-left-container">
        <div class="accent-line-left"></div>
        <span class="star-flare left-side">✦</span>
      </div>

      <div class="brand-secondary-icon-container">
        <div class="avatar-bevel-rim"></div>
        <div class="avatar-tracker-ring"></div>
        <div class="avatar-center-vortex"></div>
        <div class="compass-needle-group">
          <div class="needle-point primary pt-n"></div>
          <div class="needle-point primary pt-e"></div>
          <div class="needle-point primary pt-s"></div>
          <div class="needle-point primary pt-w"></div>
          <div class="needle-point secondary pt-ne"></div>
          <div class="needle-point secondary pt-se"></div>
          <div class="needle-point secondary pt-sw"></div>
          <div class="needle-point secondary pt-nw"></div>
        </div>
      </div>

      <div class="accent-line-right-container">
        <span class="star-flare right-side">✦</span>
        <div class="accent-line-right"></div>
      </div>
    </div>

    <div class="subtitle-row-box" aria-hidden="true">
      <div class="border-divider-line">
        <span class="diamond-node left">✦</span>
        <div class="line-strut"></div>
        <span class="diamond-node right">✦</span>
      </div>
      <p class="tagline-text-element">
        <span>Structured Thinking.</span>
        <span>Empowered Living.</span>
        <span>Conscious Creation.</span>
      </p>
      <div class="border-divider-line">
        <span class="diamond-node left">✦</span>
        <div class="line-strut"></div>
        <span class="diamond-node right">✦</span>
      </div>
    </div>

  </div>
</header>

<input type="checkbox" id="nav-toggle" aria-label="Toggle navigation">

<nav aria-label="Main navigation">

  <div class="nav-inner">
    <label class="nav-toggle-label" for="nav-toggle" aria-label="Open menu">
      <span></span>
    </label>
  </div>

  <ul>
    <li><a href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
    <li><a href="{{ site.baseurl }}/law-of-attraction-quotes/"{% if page.url contains 'quotes' %} aria-current="page"{% endif %}>Quotes</a></li>
    <li><a href="{{ site.baseurl }}/law-of-attraction-love-relationships/"{% if page.url contains 'love' %} aria-current="page"{% endif %}>Love &amp; Relationships</a></li>
    <li><a href="{{ site.baseurl }}/law-attraction-money-abundance-101/"{% if page.url contains 'money' %} aria-current="page"{% endif %}>Money &amp; Finance</a></li>
    <li><a href="{{ site.baseurl }}/how-to-use-the-law-of-attraction/"{% if page.url contains 'how-to' %} aria-current="page"{% endif %}>How To Guide</a></li>
    <li><a href="{{ site.baseurl }}/about/"{% if page.url contains 'about' %} aria-current="page"{% endif %}>About</a></li>
  </ul>

</nav>
