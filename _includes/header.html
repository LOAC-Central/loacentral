<style>
  /* HEADER IMAGE — ZERO CLS */
  header {
    background: #0b0b0b;
    width: 100%;
    aspect-ratio: 1440 / 533;
    overflow: hidden;
  }

  header img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* CHECKBOX HACK */
  #nav-toggle { display: none; }

  /* Hamburger label — hidden on desktop */
  .nav-toggle-label {
    display: none;
    cursor: pointer;
    padding: 12px 15px;
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1001;
  }

  .nav-toggle-label span,
  .nav-toggle-label span::before,
  .nav-toggle-label span::after {
    display: block;
    background: #d4af7a;
    height: 2px;
    width: 22px;
    border-radius: 1px;
    position: relative;
    transition: all 0.3s ease;
  }
  .nav-toggle-label span::before,
  .nav-toggle-label span::after {
    content: '';
    position: absolute;
  }
  .nav-toggle-label span::before { top: -7px; }
  .nav-toggle-label span::after  { top: 7px; }

  /* X animation when open */
  #nav-toggle:checked ~ nav .nav-toggle-label span { background: transparent; }
  #nav-toggle:checked ~ nav .nav-toggle-label span::before {
    transform: rotate(45deg);
    top: 0;
  }
  #nav-toggle:checked ~ nav .nav-toggle-label span::after {
    transform: rotate(-45deg);
    top: 0;
  }

  /* STICKY NAV */
  nav {
    background: #0f0f0f;
    border-bottom: 1px solid #d4af7a;
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
  }

  /* nav-inner: hidden on desktop */
  .nav-inner {
    display: none;
  }

  nav ul {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    padding: 0;
    margin: 0;
  }

  nav ul li a {
    display: block;
    color: #d4af7a;
    text-decoration: none;
    font-family: 'Lato', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
    padding: 14px 14px;
    transition: color 0.2s ease, background 0.2s ease;
    white-space: nowrap;
  }

  nav ul li a:hover,
  nav ul li a[aria-current="page"] {
    color: #fff;
    background: rgba(212, 175, 122, 0.08);
  }

  /* MOBILE NAV */
  @media (max-width: 768px) {

    .nav-toggle-label {
      display: block;
    }

    .nav-inner {
      display: flex;
      position: relative;
      padding: 14px 15px;
      align-items: center;
      justify-content: center;
      min-height: 50px;
    }

    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      color: #d4af7a;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    nav ul {
      display: none;
      flex-direction: column;
      width: 100%;
      border-top: 1px solid rgba(212, 175, 122, 0.2);
    }

    #nav-toggle:checked ~ nav ul {
      display: flex;
    }

    nav ul li {
      width: 100%;
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 122, 0.1);
    }

    nav ul li:last-child {
      border-bottom: none;
    }

    nav ul li a {
      padding: 14px 20px;
      font-size: 0.8rem;
    }
  }
</style>

<header>
  <img
    src="{{ site.baseurl }}/header.webp"
    alt="Law of Attraction Central"
    width="1440"
    height="533"
    fetchpriority="high"
  >
</header>

<input type="checkbox" id="nav-toggle" aria-label="Toggle navigation">

<nav aria-label="Main navigation">

  <div class="nav-inner">
    <span class="nav-brand">Law of Attraction Central</span>
    <label class="nav-toggle-label" for="nav-toggle" aria-label="Open menu">
      <span></span>
    </label>
  </div>

  <ul>
    <li><a href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
    <li><a href="{{ site.baseurl }}/law-of-attraction-quotes/"{% if page.url contains 'quotes' %} aria-current="page"{% endif %}>Quotes</a></li>
    <li><a href="{{ site.baseurl }}/law-of-attraction-love-relationships/"{% if page.url contains 'love' %} aria-current="page"{% endif %}>Love &amp; Relationships</a></li>
    <li><a href="{{ site.baseurl }}/law-attraction-money-abundance-101/"{% if page.url contains 'money' %} aria-current="page"{% endif %}>Money &amp; Finance</a></li>
    <li><a href="{{ site.baseurl }}/how-to-guide/"{% if page.url contains 'how-to' %} aria-current="page"{% endif %}>How To Guide</a></li>
    <li><a href="{{ site.baseurl }}/about/"{% if page.url contains 'about' %} aria-current="page"{% endif %}>About</a></li>
  </ul>

</nav>
