<style>
  footer {
    background: #0b0b0b;
    color: #d4af7a;
    width: 100%;
    padding: 40px 20px 28px;
    border-top: 1px solid rgba(212, 175, 122, 0.25);
  }

  .footer-inner {
    max-width: 850px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px; /* reduced from 22px */
  }

  .footer-wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #d4af7a;
    text-align: center;
    line-height: 1.2;
  }

  .footer-wordmark span {
    display: block;
    font-family: 'Lato', sans-serif;
    font-size: 0.65rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(212, 175, 122, 0.70);
    margin-top: 6px;
  }

  .footer-rule {
    width: 60px;
    height: 1px;
    background: rgba(212, 175, 122, 0.35);
    border: none;
    margin: 0; /* FIX: kills browser-default <hr> margins */
    flex-shrink: 0;
  }

  /* Social icons — no width/border on the nav wrapper itself */
  .footer-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .footer-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(212, 175, 122, 0.3);
    border-radius: 50%;
    color: rgba(212, 175, 122, 0.7);
    text-decoration: none;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
    flex-shrink: 0;
  }

  .footer-social a:hover {
    border-color: #d4af7a;
    color: #d4af7a;
    background: rgba(212, 175, 122, 0.06);
  }

  .footer-social a svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    display: block;
  }

  .footer-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 0;
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .footer-nav li {
    display: flex;
    align-items: center;
  }

  .footer-nav li + li::before {
    content: '';
    display: inline-block;
    width: 1px;
    height: 10px;
    background: rgba(212, 175, 122, 0.3);
    margin: 0 14px;
  }

  .footer-nav a {
    font-family: 'Lato', sans-serif;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(212, 175, 122, 0.65);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .footer-nav a:hover {
    color: #d4af7a;
  }

  .footer-copy {
    font-family: 'Lato', sans-serif;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: rgba(212, 175, 122, 0.70);
    text-align: center;
    line-height: 1.8;
    margin: 0;
  }

  @media (max-width: 600px) {
    footer { padding: 32px 20px 24px; }
    .footer-wordmark { font-size: 1.3rem; }
    .footer-social { gap: 12px; }
    .footer-nav { gap: 8px 0; }
    .footer-nav li + li::before { margin: 0 10px; }
  }
</style>
